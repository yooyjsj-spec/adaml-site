name: smd-lab

services:
  web:
    image: smd-lab-web:20260913-2006
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: smd-lab-api:20260913-2006
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_PATH: /uploads
      ADMIN_CRYPTO_KEY: ${ADMIN_CRYPTO_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run seed &&
             node server/dist/index.js"
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smd_lab
      POSTGRES_USER: smd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smd -d smd_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
